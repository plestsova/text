<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка правописания</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
body{
  background:linear-gradient(145deg,#f0f4fa,#dfe7f3);
  min-height:100vh;margin:0;padding:20px;
  display:flex;justify-content:center;align-items:flex-start;
}
.card{
  background:#fff;border-radius:28px;padding:32px 36px;
  max-width:760px;width:100%;
  box-shadow:0 20px 40px rgba(0,20,40,.15);
}
h1{font-size:2rem;color:#1e3c72;text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#5c7290;margin-bottom:24px;padding-bottom:14px;border-bottom:1px dashed #b7c9e0;font-size:.95rem}

.input-area{position:relative;margin-bottom:18px}
textarea{
  width:100%;min-height:100px;padding:16px 18px;font-size:1.1rem;
  border:2px solid #dce5f0;border-radius:16px;resize:vertical;
  font-family:'Segoe UI',sans-serif;outline:none;transition:.2s;
  background:#fbfdff;color:#1e2f44;line-height:1.5;
}
textarea:focus{border-color:#3b6cb0;background:#fff;box-shadow:0 0 0 4px rgba(59,108,176,.1)}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{
  flex:1;min-width:150px;padding:14px 24px;font-size:1.05rem;font-weight:600;
  border:none;border-radius:50px;cursor:pointer;transition:.2s;
  border:1px solid #d0ddeb;color:#1e3c72;background:#fff;
}
.btn.primary{background:#1e3c72;color:#fff;border-color:#2a4f8a}
.btn.primary:hover{background:#2a4f8a;transform:translateY(-2px);box-shadow:0 10px 20px -8px #1e3c72}
.btn:hover{background:#f0f5ff;transform:translateY(-2px)}
.btn.primary:hover{background:#2a4f8a}

/* Общий результат */
.accuracy{
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  border-radius:20px;padding:22px;color:#fff;text-align:center;
  margin-bottom:20px;
}
.accuracy .num{font-size:3rem;font-weight:700;font-family:'Courier New',monospace;line-height:1}
.accuracy .label{font-size:.95rem;opacity:.9;margin-top:8px;letter-spacing:.5px}
.accuracy.ok{background:linear-gradient(135deg,#1a7f37,#2ea44f)}
.accuracy.mid{background:linear-gradient(135deg,#c47b00,#e8a020)}
.accuracy.bad{background:linear-gradient(135deg,#a01020,#d02a3a)}

/* Разбор */
.analysis{display:flex;flex-direction:column;gap:12px}
.word-block{
  background:#f5f8ff;border:2px solid #d3e1f5;border-radius:16px;
  padding:16px 18px;display:flex;flex-direction:column;gap:10px;
}
.word-title{
  font-size:1.15rem;font-weight:700;color:#1e3c72;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.status{
  font-size:.8rem;font-weight:700;padding:3px 12px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.5px;
}
.status.ok{background:#d4f0dd;color:#116b2c}
.status.err{background:#ffe0e0;color:#b22234}
.status.warn{background:#fff2d0;color:#8a5b00}

.word-line{
  font-family:'Courier New',monospace;font-size:1.15rem;
  display:flex;flex-wrap:wrap;gap:2px;line-height:1.6;
}
.ltr{
  display:inline-block;padding:2px 4px;border-radius:4px;
}
.ltr.bad{background:#ffd5d5;color:#b22234;font-weight:700}
.ltr.miss{background:#ffe9b0;color:#8a5b00;font-weight:700}
.ltr.ok{color:#1e2f44}
.ltr.extra{background:#ffd5d5;color:#b22234;text-decoration:line-through}

.correction{
  background:#fff;border-radius:12px;padding:12px 16px;
  font-size:1rem;line-height:1.6;color:#1e2f44;
  border-left:4px solid #2ea44f;
}
.correction .arrow{color:#2ea44f;font-weight:700;font-size:1.2rem}
.correction .fixed{color:#116b2c;font-weight:700;font-family:'Courier New',monospace}

.explain{
  font-size:.92rem;color:#5c7290;background:#eef4fc;
  padding:10px 14px;border-radius:10px;line-height:1.5;
}
.explain b{color:#1e3c72}

.suggestions{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font-size:.92rem;color:#5c7290;
}
.suggestions .chip{
  background:#e2eaf5;color:#1e3c72;font-weight:600;
  padding:5px 14px;border-radius:20px;cursor:pointer;
  border:1px solid #c2d2e8;font-family:'Courier New',monospace;
  transition:.15s;
}
.suggestions .chip:hover{background:#c7daf0}

.empty{
  text-align:center;color:#8ba0b8;padding:30px 10px;
  font-size:1rem;line-height:1.6;
}
.empty .big{font-size:2.5rem;display:block;margin-bottom:10px}

.footer{text-align:center;margin-top:22px;font-size:.78rem;color:#8ba0b8}

@media (max-width:560px){
  .card{padding:22px 18px}
  h1{font-size:1.6rem}
  .accuracy .num{font-size:2.2rem}
  .btn{padding:12px 18px;font-size:.95rem}
}
</style>

    "зачем","кто","чей","этот","тот","такой","весь","всё","каждый","любой","другой","сам","самый",

    "я","ты","он","она","оно","мы","вы","они","меня","тебя","его","её","нас","вас","их","мой",

  // Приведение словаря к Set для быстрой проверки
  var DICT_SET = {};
  for (var i = 0; i < DICT.length; i++) {
    DICT_SET[DICT[i].toLowerCase()] = true;
  }

  // =========================================================
  // АЛГОРИТМ ЛЕВЕНШТЕЙНА — расстояние между строками
  // =========================================================
  function levenshtein(a, b) {
    a = a.toLowerCase();
    b = b.toLowerCase();
    var m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    var prev = [], curr = [];
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      curr[0] = i;
      for (var j2 = 1; j2 <= n; j2++) {
        var cost = a[i - 1] === b[j2 - 1] ? 0 : 1;
        curr[j2] = Math.min(
          prev[j2] + 1,        // удаление
          curr[j2 - 1] + 1,    // вставка
          prev[j2 - 1] + cost  // замена
        );
      }
      prev = curr.slice();
    }
    return prev[n];
  }

  // Поиск похожих слов в словаре
  function findSuggestions(word, maxResults) {
    word = word.toLowerCase();
    var results = [];
    for (var i = 0; i < DICT.length; i++) {
      var w = DICT[i].toLowerCase();
      // Слишком далёкие слова не проверяем
      if (Math.abs(w.length - word.length) > 4) continue;
      var d = levenshtein(word, w);
      // Порог: допускаем до 3 ошибок
      var maxDist = word.length <= 4 ? 1 : word.length <= 7 ? 2 : 3;
      if (d > 0 && d <= maxDist) {
        results.push({ word: DICT[i], dist: d });
      }
    }
    results.sort(function(a, b) { return a.dist - b.dist; });
    return results.slice(0, maxResults || 4);
  }

  // =========================================================
  // РАЗБОР ОШИБКИ — посимвольное сравнение
  // =========================================================
  function explainError(input, correct) {
    var inp = input.toLowerCase();
    var cor = correct.toLowerCase();
    var explains = [];

    if (inp.length === cor.length) {
      // Ошибки замены
      var positions = [];
      for (var i = 0; i < inp.length; i++) {
        if (inp[i] !== cor[i]) {
          positions.push({ i: i, from: inp[i], to: cor[i] });
        }
      }
      if (positions.length === 1) {
        var p = positions[0];
        explains.push('Буква <b>«' + p.from + '»</b> на позиции ' + (p.i + 1) +
                     ' заменена на <b>«' + p.to + '»</b>.');
      } else if (positions.length > 1) {
        var list = positions.map(function(p) {
          return 'поз. ' + (p.i + 1) + ': «' + p.from + '» → «' + p.to + '»';
        }).join('; ');
        explains.push('Несколько замен: ' + list + '.');
      }
    } else if (inp.length < cor.length) {
      // Пропущенные буквы
      var j = 0, missing = [];
      for (var k = 0; k < cor.length; k++) {
        if (j < inp.length && inp[j] === cor[k]) {
          j++;
        } else {
          missing.push({ pos: k, ch: cor[k] });
        }
      }
      if (missing.length === 1) {
        explains.push('Пропущена буква <b>«' + missing[0].ch + '»</b> на позиции ' + (missing[0].pos + 1) + '.');
      } else {
        var s = missing.map(function(m) { return '«' + m.ch + '» (поз. ' + (m.pos + 1) + ')'; }).join(', ');
        explains.push('Пропущены буквы: ' + s + '.');
      }
    } else {
      // Лишние буквы
      var j2 = 0, extra = [];
      for (var k2 = 0; k2 < inp.length; k2++) {
        if (j2 < cor.length && inp[k2] === cor[j2]) {
          j2++;
        } else {
          extra.push({ pos: k2, ch: inp[k2] });
        }
      }
      if (extra.length === 1) {
        explains.push('Лишняя буква <b>«' + extra[0].ch + '»</b> на позиции ' + (extra[0].pos + 1) + '.');
      } else {
        var s2 = extra.map(function(e) { return '«' + e.ch + '» (поз. ' + (e.pos + 1) + ')'; }).join(', ');
        explains.push('Лишние буквы: ' + s2 + '.');
      }
    }

    // Проверка распространённых правил
    var rules = checkCommonRules(inp, cor);
    for (var r = 0; r < rules.length; r++) explains.push(rules[r]);

    return explains;
  }

  // Проверка типичных орфографических правил
  function checkCommonRules(inp, cor) {
    var out = [];
    // ЖИ-ШИ с И
    if (/жы|шы/.test(inp) && /жи|ши/.test(cor)) {
      out.push('📌 Правило: <b>ЖИ и ШИ</b> пишутся с буквой <b>И</b> (жить, машина, шишка).');
    }
    // ЧА-ЩА с А
    if (/чя|щя/.test(inp) && /ча|ща/.test(cor)) {
      out.push('📌 Правило: <b>ЧА и ЩА</b> пишутся с буквой <b>А</b> (чашка, щавель, площадь).');
    }
    // ЧУ-ЩУ с У
    if (/чю|щю/.test(inp) && /чу|щу/.test(cor)) {
      out.push('📌 Правило: <b>ЧУ и ЩУ</b> пишутся с буквой <b>У</b> (чудо, щука, чулок).');
    }
    // Проверяемые безударные гласные
    if (inp.indexOf('а') !== -1 && cor.indexOf('о') !== -1) {
      if (inp.replace(/а/g, 'о') === cor || cor.replace(/о/g, 'а') === inp) {
        out.push('📌 Возможно, это <b>проверяемая безударная гласная</b>: подберите проверочное слово, где гласная под ударением.');
      }
    }
    // Мягкий знак
    if (inp.indexOf('ь') === -1 && cor.indexOf('ь') !== -1) {
      out.push('📌 Пропущен <b>мягкий знак (ь)</b> — проверьте, нужен ли он в этом слове.');
    }
    if (inp.indexOf('ь') !== -1 && cor.indexOf('ь') === -1) {
      out.push('📌 Лишний <b>мягкий знак (ь)</b> — в этом слове он не нужен.');
    }
    // Двойные согласные
    if (/н/.test(inp) && /нн/.test(cor) && inp.replace(/н/g, '') === cor.replace(/н/g, '')) {
      out.push('📌 Возможно, нужна <b>удвоенная согласная НН</b> (например: картинный, длинный).');
    }
    return out;
  }

  // =========================================================
  // ГЛАВНАЯ ЛОГИКА ПРОВЕРКИ
  // =========================================================
  function checkText(text) {
    // Разбиваем на слова (буквы, дефис, апостроф)
    var words = text.match(/[А-Яа-яЁёA-Za-z]+(-[А-Яа-яЁёA-Za-z]+)*/g) || [];
    var tokens = [];
    var re = /[А-Яа-яЁёA-Za-z]+(-[А-Яа-яЁёA-Za-z]+)*/g;
    var lastIndex = 0;
    var m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > lastIndex) {
        tokens.push({ type: 'sep', text: text.slice(lastIndex, m.index) });
      }
      tokens.push({ type: 'word', text: m[0], index: m.index });
      lastIndex = re.lastIndex;
    }
    if (lastIndex < text.length) {
      tokens.push({ type: 'sep', text: text.slice(lastIndex) });
    }

    var results = [];
    for (var i = 0; i < tokens.length; i++) {
      if (tokens[i].type !== 'word') continue;
      var w = tokens[i].text;
      var lower = w.toLowerCase();
      var isCorrect = DICT_SET[lower] === true;
      var suggestions = [];
      var explains = [];

      if (!isCorrect) {
        // Ищем похожие слова
        suggestions = findSuggestions(lower, 4);
        // Объясняем на основе лучшего совпадения
        if (suggestions.length > 0) {
          explains = explainError(lower, suggestions[0].word.toLowerCase());
        }
      }

      results.push({
        word: w,
        correct: isCorrect,
        suggestions: suggestions,
        explains: explains
      });
    }
    return { tokens: tokens, results: results };
  }

  // =========================================================
  // ОТРИСОВКА РЕЗУЛЬТАТА
  // =========================================================
  function escapeHTML(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderResult(data) {
    var tokens = data.tokens;
    var results = data.results;
    var totalWords = results.length;
    var correctWords = 0;
    for (var i = 0; i < results.length; i++) if (results[i].correct) correctWords++;

    var accuracy = totalWords === 0 ? 0 : Math.round(correctWords / totalWords * 100);

    // Общий блок точности
    var acc = document.getElementById('accuracy');
    var accNum = document.getElementById('accNum');
    var accLabel = document.getElementById('accLabel');
    acc.style.display = 'block';
    accNum.textContent = accuracy + '%';
    acc.className = 'accuracy';
    if (accuracy === 100) {
      acc.classList.add('ok');
      accLabel.textContent = '✅ Отлично! Все слова написаны верно';
    } else if (accuracy >= 60) {
      acc.classList.add('mid');
      accLabel.textContent = '⚠️ Есть ошибки — исправьте их';
    } else {
      acc.classList.add('bad');
      accLabel.textContent = '❌ Много ошибок — посмотрите разбор ниже';
    }

    // Список разбора
    var analysis = document.getElementById('analysis');
    analysis.innerHTML = '';

    if (results.length === 0) {
      analysis.innerHTML = '<div class="empty"><span class="big">📖</span>Введите хотя бы одно слово</div>';
      return;
    }

    // Проходим по всем словам
    for (var k = 0; k < results.length; k++) {
      var r = results[k];
      var block = document.createElement('div');
      block.className = 'word-block';

      // Заголовок
      var title = document.createElement('div');
      title.className = 'word-title';
      title.innerHTML = escapeHTML(r.word) +
        '<span class="status ' + (r.correct ? 'ok' : 'err') + '">' +
        (r.correct ? '✅ верно' : '❌ ошибка') + '</span>';
      block.appendChild(title);

      if (r.correct) {
        var okMsg = document.createElement('div');
        okMsg.className = 'correction';
        okMsg.innerHTML = '<span class="arrow">✓</span> Слово написано правильно: <span class="fixed">' +
          escapeHTML(r.word) + '</span>';
        block.appendChild(okMsg);
      } else {
        // Посимвольное сравнение с лучшим вариантом
        var best = r.suggestions.length > 0 ? r.suggestions[0].word : null;
        var letters = document.createElement('div');
        letters.className = 'word-line';
        letters.innerHTML = buildLetterDiff(r.word, best);
        block.appendChild(letters);

        // Правильное написание
        if (best) {
          var cor = document.createElement('div');
          cor.className = 'correction';
          cor.innerHTML = '<span class="arrow">→</span> Правильно: <span class="fixed">' +
            escapeHTML(best) + '</span>';
          block.appendChild(cor);
        }

        // Объяснения
        if (r.explains.length > 0) {
          for (var e = 0; e < r.explains.length; e++) {
            var ex = document.createElement('div');
            ex.className = 'explain';
            ex.innerHTML = r.explains[e];
            block.appendChild(ex);
          }
        }

        // Похожие слова
        if (r.suggestions.length > 0) {
          var sug = document.createElement('div');
          sug.className = 'suggestions';
          var chips = r.suggestions.map(function(s) {
            return '<span class="chip">' + escapeHTML(s.word) + '</span>';
          }).join('');
          sug.innerHTML = '<span>Похожие слова:</span> ' + chips;
          block.appendChild(sug);
        } else {
          var noSug = document.createElement('div');
          noSug.className = 'explain';
          noSug.innerHTML = '🤔 Точного совпадения в словаре не найдено. Проверьте слово ещё раз.';
          block.appendChild(noSug);
        }
      }

      analysis.appendChild(block);
    }
  }
