  // ===== Расстояние Левенштейна =====
  function levenshtein(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    var m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    var prev = [], curr = [];
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      curr[0] = i;
      for (var j2 = 1; j2 <= n; j2++) {
        var cost = a[i-1] === b[j2-1] ? 0 : 1;
        curr[j2] = Math.min(prev[j2]+1, curr[j2-1]+1, prev[j2-1]+cost);
      }
      prev = curr.slice();
    }
    return prev[n];
  }

  // ===== Поиск похожих слов с учётом частотности =====
  function findSuggestions(word) {
    word = word.toLowerCase();

      var w = DICT[i].toLowerCase();
      var d = levenshtein(word, w);
      var maxDist = word.length <= 3 ? 1 : word.length <= 5 ? 1 : word.length <= 8 ? 2 : 3;
      if (d > 0 && d <= maxDist) {
        // Приоритет словам с такой же первой буквой и похожей длиной
        var score = d;
        if (w[0] === word[0]) score -= 0.3;
        if (Math.abs(w.length - word.length) <= 1) score -= 0.2;
        results.push({ word: DICT[i], dist: d, score: score });
      }
    }
    results.sort(function(a, b) { return a.score - b.score; });
    return results.slice(0, 5);

  // ===== Выравнивание слов (DP) =====
  function alignWords(a, b) {
    var m = a.length, n = b.length;
    var dp = [];
    for (var i = 0; i <= m; i++) {

      for (var j = 0; j <= n; j++) {

        else if (j === 0) dp[i][j] = i;
        else {
          var cost = a[i-1] === b[j-1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
        }
      }
    }
    
    // Обратный проход для восстановления операций
    var ops = [];
    var i = m, j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
        ops.push({ type: 'match', ch: a[i-1], pos: i-1 });
        i--; j--;
      } else if (i > 0 && j > 0 && dp[i][j] === dp[i-1][j-1] + 1) {
        ops.push({ type: 'sub', from: a[i-1], to: b[j-1], pos: i-1 });
        i--; j--;
      } else if (i > 0 && dp[i][j] === dp[i-1][j] + 1) {
        ops.push({ type: 'del', ch: a[i-1], pos: i-1 });
        i--;
      } else {
        ops.push({ type: 'ins', ch: b[j-1], pos: i });
        j--;
      }
    }
    return ops.reverse();
  }

      if (/^[А-Яа-яЁёA-Za-z]/.test(t)) tokens.push({ type: 'word', text: t });

    return tokens;
  }
